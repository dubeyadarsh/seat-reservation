services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-seatbooking}
      POSTGRES_USER: ${DB_USER:-seatbooking}
      # Local-development credential only; production reads DB_PASSWORD from the platform.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-seatbooking}
      DB_USER: ${DB_USER:-seatbooking}
      DB_PASSWORD: ${DB_PASSWORD:-localdev}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_SSL_MODE: disable
      # Local-development fallbacks only; set real values in .env.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789}
      JWT_TTL: ${JWT_TTL:-1h}
      AUTH_DEV_TOKEN_ENABLED: ${AUTH_DEV_TOKEN_ENABLED:-true}
      ADMIN_SECRET: ${ADMIN_SECRET:-local-dev-admin-secret}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8080}:8080"
    mem_limit: 512m

volumes:
  pgdata:
