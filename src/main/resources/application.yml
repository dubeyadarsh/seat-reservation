server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # Connections beyond max-connections wait in the OS backlog instead of being refused by the kernel.
    accept-count: ${TOMCAT_ACCEPT_COUNT:1000}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}

spring:
  application:
    name: seat-booking
  config:
    # Local runs read values from ./.env; real environment variables still take precedence.
    # Optional, so Render and Docker (where .env is absent) start normally.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seatbooking}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USER:seatbooking}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: seatbooking-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Fixed-size pool: no connection setup in the middle of a burst.
      minimum-idle: ${DB_POOL_MIN_IDLE:${DB_POOL_SIZE:20}}
      # Admission control keeps waits short; a request that still waits this long is answered 429.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      data-source-properties:
        # Enforced by PostgreSQL itself, so a stuck query or lock wait can never pin a connection.
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:5000} -c lock_timeout=${DB_LOCK_TIMEOUT_MS:3000}"

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true
    deserialization:
      # Money is integer paise: reject 250.5 instead of silently truncating it to 250.
      accept-float-as-int: false

management:
  endpoints:
    web:
      # Serves /health/liveness, /health/readiness and /metrics at the root instead of under /actuator.
      base-path: /
      exposure:
        include: health, prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness stays independent of the DB so a DB outage never triggers a restart loop.
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      # A handful of fixed buckets still gives p95/p99 via histogram_quantile, at a fraction of the
      # per-request cost and scrape size of the ~70-bucket default histogram.
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s, 30s

springdoc:
  show-actuator: true
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.seatbooking: ${LOG_LEVEL:INFO}

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${JWT_TTL:1h}
    issuer: ${JWT_ISSUER:seat-booking}
    dev-token-enabled: ${AUTH_DEV_TOKEN_ENABLED:false}
    admin-secret: ${ADMIN_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  load-shedding:
    max-concurrent-requests: ${MAX_CONCURRENT_REQUESTS:32}
    queue-timeout: ${REQUEST_QUEUE_TIMEOUT:30s}
    retry-after: ${RETRY_AFTER:2s}
  cache:
    sold-seat-ttl: ${SOLD_SEAT_CACHE_TTL:10s}
    sold-seat-max-entries: ${SOLD_SEAT_CACHE_MAX_ENTRIES:100000}
    show-max-entries: ${SHOW_CACHE_MAX_ENTRIES:10000}
    verified-token-max-entries: ${TOKEN_CACHE_MAX_ENTRIES:10000}
