server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: seat-booking
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seatbooking}
    username: ${DB_USER:seatbooking}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: seatbooking-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  flyway:
    enabled: true
    locations: classpath:db/migration
