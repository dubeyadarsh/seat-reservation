server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: seat-booking
  config:
    # Local runs read values from ./.env; real environment variables still take precedence.
    # Optional, so Render and Docker (where .env is absent) start normally.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seatbooking}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USER:seatbooking}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: seatbooking-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true
    deserialization:
      # Money is integer paise: reject 250.5 instead of silently truncating it to 250.
      accept-float-as-int: false

management:
  endpoints:
    web:
      # Serves /health/liveness, /health/readiness and /metrics at the root instead of under /actuator.
      base-path: /
      exposure:
        include: health, prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness stays independent of the DB so a DB outage never triggers a restart loop.
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.seatbooking: ${LOG_LEVEL:INFO}

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${JWT_TTL:1h}
    issuer: ${JWT_ISSUER:seat-booking}
    dev-token-enabled: ${AUTH_DEV_TOKEN_ENABLED:false}
    admin-secret: ${ADMIN_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
